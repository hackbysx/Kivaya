<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXI V8 DOMINATOR - QUAD CORE MASTER</title>
    <style>
        :root {
            --bg-primary: #08090f;
            --bg-secondary: #0f111a;
            --neon-blue: #00f3ff;
            --neon-purple: #9d4edd;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --gold: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .master-container { width: 100%; max-width: 460px; background: var(--bg-secondary); border: 2px solid var(--neon-purple); border-radius: 24px; box-shadow: 0 0 30px rgba(157, 78, 221, 0.25); padding: 25px; position: relative; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .header h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .header p { font-size: 10px; color: var(--text-muted); margin-top: 4px; letter-spacing: 3px; text-transform: uppercase; }
        
        .display-panel { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .current-period { font-size: 13px; color: var(--text-muted); }
        .current-period span { color: var(--neon-blue); font-weight: bold; font-family: monospace; }
        .timer-display { font-size: 24px; color: var(--gold); font-weight: 800; margin: 5px 0; font-family: monospace; }
        
        .prediction-output { font-size: 44px; font-weight: 900; letter-spacing: 2px; margin: 8px 0; text-transform: uppercase; }
        .prediction-output.big { color: var(--neon-green); text-shadow: 0 0 20px rgba(57, 255, 20, 0.5); }
        .prediction-output.small { color: var(--neon-red); text-shadow: 0 0 20px rgba(255, 49, 49, 0.5); }
        .prediction-output.analyzing { color: var(--text-muted); font-size: 28px; animation: pulse 1.5s infinite; }
        
        .signal-meter { width: 100%; background: rgba(255, 255, 255, 0.03); height: 6px; border-radius: 3px; margin-top: 15px; overflow: hidden; }
        .signal-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue)); box-shadow: 0 0 10px var(--neon-blue); transition: width 0.6s ease; }
        .signal-text { font-size: 11px; color: var(--text-muted); margin-top: 8px; font-family: monospace; }
        .signal-text span { color: var(--gold); font-weight: bold; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 10px; text-align: center; }
        .stat-card p { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
        .stat-card h2 { font-size: 16px; margin-top: 2px; font-weight: 700; }

        .history-panel { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 15px; max-height: 200px; display: flex; flex-direction: column; }
        .history-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .history-list { overflow-y: auto; flex-grow: 1; }
        .history-item { display: flex; justify-content: space-between; padding: 6px 8px; background: rgba(255, 255, 255, 0.01); border-radius: 6px; margin-bottom: 5px; font-size: 12px; font-family: monospace; }
        .history-item.win { border-left: 3px solid var(--neon-green); color: #cfc; }
        .history-item.loss { border-left: 3px solid var(--neon-red); color: #fcc; }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="master-container">
        <div class="header">
            <h1>Quad Core Dominator</h1>
            <p id="engineState">4 Pillars Fusion System (25% x4)</p>
        </div>

        <div class="display-panel">
            <div class="current-period">TARGET PERIOD: <span id="targetPeriod">FETCHING...</span></div>
            <div id="clockTimer" class="timer-display">00:60</div>
            <div class="prediction-output analyzing" id="predictionText">CONNECTING</div>
            <div class="signal-meter"><div class="signal-bar" id="signalBar"></div></div>
            <div class="signal-text">
                <span id="mLevel">MARTINGALE: LV 1 (1X)</span> | WEIGHTS: <span id="wState">BALANCED</span>
            </div>
            <div id="numRow" style="display: flex; justify-content: center; gap: 8px; margin-top: 10px;"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><p>WIN</p><h2 id="sWin" style="color:var(--neon-green);">0</h2></div>
            <div class="stat-card"><p>LOSS</p><h2 id="sLoss" style="color:var(--neon-red);">0</h2></div>
            <div class="stat-card"><p>ACCURACY</p><h2 id="sAcc" style="color:var(--gold);">0%</h2></div>
        </div>

        <div class="history-panel">
            <div class="history-header"><span>RECENT LOGS</span><span style="color:var(--neon-blue); cursor:pointer;" onclick="resetStats()">RESET</span></div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";
        
        let logs = JSON.parse(localStorage.getItem('quad_core_logs')) || [];
        let lastPeriod = null, expectedPeriod = null, cachedPred = null;
        let lossStreak = 0, currentLevel = 1;
        let targetNums = [];

        // ৪টি খুঁটির গাণিতিক বেস ওয়েট (২৫% করে প্রতিটি)
        let weights = { p1: 0.25, p2: 0.25, p3: 0.25, p4: 0.25 };

        window.onload = () => {
            renderLogs();
            updateStats();
            setInterval(fetchMarketData, 2000);
            setInterval(runClock, 1000);
        };

        function runClock() {
            const sec = 60 - new Date().getSeconds();
            document.getElementById('clockTimer').innerText = `00:${sec < 10 ? '0'+sec : sec}`;
        }

        async function fetchMarketData() {
            try {
                const res = await fetch(API_URL + '?t=' + Date.now());
                const json = await res.json();
                const node = json.data.list[0];
                
                if (lastPeriod !== node.issueNumber) {
                    if (expectedPeriod && lastPeriod === node.issueNumber) {
                        evaluateCycle(node.issueNumber, parseInt(node.number));
                    }
                    lastPeriod = node.issueNumber;
                    expectedPeriod = (BigInt(lastPeriod) + 1n).toString();
                    document.getElementById('targetPeriod').innerText = expectedPeriod;
                    
                    calculateQuadPrediction(expectedPeriod, json.data.list);
                }
            } catch (e) {}
        }

        function calculateQuadPrediction(targetPeriod, list) {
            const output = document.getElementById('predictionText');
            output.innerText = "ANALYZING...";
            output.className = "prediction-output analyzing";

            setTimeout(() => {
                const seed = parseInt(targetPeriod.slice(-4));
                const results = list.slice(0, 20).map(x => parseInt(x.number));
                const bigCount = results.filter(n => n >= 5).length;
                const smallCount = results.filter(n => n <= 4).length;

                // --- খুঁটি ১: Infinix Pro (ট্রেন্ড সিগনাল) ---
                let s1 = (seed % 2 === 0) ? 0.60 : -0.60;
                if(results[0] >= 5 && results[1] >= 5) s1 += 0.20;

                // --- খুঁটি ২: Flexi V8 (ত্রিকোণমিতিক তরঙ্গ) ---
                let s2 = (Math.sin(seed * 0.45) > 0) ? 0.75 : -0.75;

                // --- খুঁটি ৩: Premium Filter (বিপরীত সেফটি) ---
                let s3 = (list[0]?.number >= 5) ? -0.50 : 0.50;

                // --- খুঁটি ৪: New Voting Engine (৪০টি ভোটের লুপ লজিক) ---
                let bigVotes = 0, smallVotes = 0;
                for(let i=0; i<40; i++) {
                    let v = "BIG";
                    if(i < 15) v = bigCount > smallCount ? "BIG" : "SMALL";
                    else if(i < 30) {
                        let calc = ((results[0]||5) + (results[4]||5) - parseInt(targetPeriod.slice(-1))) % 10;
                        v = calc <= 4 ? "SMALL" : "BIG";
                    } else {
                        v = lossStreak >= 1 ? (bigCount > smallCount ? "SMALL" : "BIG") : (bigCount > smallCount ? "BIG" : "SMALL");
                    }
                    v === "BIG" ? bigVotes++ : smallVotes++;
                }
                let s4 = bigVotes > smallVotes ? 0.70 : -0.70;

                // ৪টি খুঁটির সম্মিলিত গাণিতিক ফিউশন সূত্র (২৫% করে সমবন্টন)
                let fusionScore = (s1 * weights.p1) + (s2 * weights.p2) + (s3 * weights.p3) + (s4 * weights.p4);

                // টাই ব্রেকার লজিক (স্কোর ০ হলেও ফিক্সড রেজাল্ট আসবে)
                let finalDecision = fusionScore >= 0 ? "BIG" : "SMALL";
                cachedPred = finalDecision;

                // এক্যুরেসি ও কনফিডেন্স মেটার লকিং
                let conf = Math.min(Math.max(Math.floor(55 + (Math.abs(fusionScore) * 85)), 75), 99);
                if (seed % 11 === 0 || seed % 19 === 0) conf = Math.floor(Math.random() * (99 - 96 + 1)) + 96; // SURE SHOT

                // টার্গেট সংখ্যা নির্ধারণ
                targetNums = finalDecision === "BIG" ? [1, 3] : [6, 8];

                output.innerText = finalDecision;
                output.className = `prediction-output ${finalDecision.toLowerCase()}`;
                document.getElementById('signalBar').style.width = `${conf}%`;
                
                document.getElementById('numRow').innerHTML = `
                    <div style="background:var(--neon-purple); border-radius:50%; width:28px; height:28px; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:12px;">${targetNums[0]}</div>
                    <div style="background:var(--neon-blue); color:#000; border-radius:50%; width:28px; height:28px; display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:12px;">${targetNums[1]}</div>
                `;
            }, 700);
        }

        function evaluateCycle(period, realNum) {
            if (!cachedPred) return;
            const outcome = realNum >= 5 ? "BIG" : "SMALL";
            const isWin = (cachedPred === outcome) || targetNums.includes(realNum);

            if (isWin) {
                lossStreak = 0; currentLevel = 1;
                // উইন হলে খুঁটি আবার ব্যালেন্সড হয়ে যাবে
                weights = { p1: 0.25, p2: 0.25, p3: 0.25, p4: 0.25 };
                document.getElementById('wState').innerText = "BALANCED";
                document.getElementById('wState').style.color = "var(--neon-green)";
            } else {
                lossStreak++; currentLevel++;
                if(currentLevel > 4) currentLevel = 1;
                
                // লস হলে খুঁটির ক্ষমতা অটো শিফট হবে (গাণিতিক তরঙ্গে বেশি পাওয়ার)
                weights = { p1: 0.15, p2: 0.40, p3: 0.15, p4: 0.30 };
                document.getElementById('wState').innerText = "RECOVERING";
                document.getElementById('wState').style.color = "var(--neon-red)";
            }

            const multi = currentLevel === 1 ? "1X" : (currentLevel === 2 ? "3X" : (currentLevel === 3 ? "9X" : "27X"));
            document.getElementById('mLevel').innerText = `MARTINGALE: LV ${currentLevel} (${multi})`;

            logs.unshift({ period: period.slice(-4), pred: cachedPred, status: isWin ? "WIN" : "LOSS" });
            if(logs.length > 50) logs.pop();
            
            localStorage.setItem('quad_core_logs', JSON.stringify(logs));
            renderLogs();
            updateStats();
        }

        function renderLogs() {
            const list = document.getElementById('historyList');
            list.innerHTML = logs.map(x => `
                <div class="history-item ${x.status.toLowerCase()}">
                    <span>PERIOD: ${x.period}</span>
                    <span>PRED: ${x.pred}</span>
                    <span style="font-weight:bold;">${x.status}</span>
                </div>
            `).join('');
        }

        function updateStats() {
            const total = logs.length;
            if(total === 0) return;
            const wins = logs.filter(x => x.status === "WIN").length;
            document.getElementById('sWin').innerText = wins;
            document.getElementById('sLoss').innerText = total - wins;
            document.getElementById('sAcc').innerText = `${Math.round((wins/total)*100)}%`;
        }

        function resetStats() {
            logs = []; localStorage.removeItem('quad_core_logs');
            document.getElementById('sWin').innerText = 0;
            document.getElementById('sLoss').innerText = 0;
            document.getElementById('sAcc').innerText = "0%";
            renderLogs();
        }
    </script>
</body>
</html>
